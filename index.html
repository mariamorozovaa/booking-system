<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking System - Система бронирования</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Заголовок -->
      <header class="header">
        <h1>🏨 Hotel Booking</h1>
        <p class="subtitle">Забронируйте свой идеальный отдых</p>
      </header>

      <!-- Навигация -->
      <nav class="nav-tabs">
        <button class="tab-btn active" data-tab="rooms">Выбор номера</button>
        <button class="tab-btn" data-tab="bookings">Мои бронирования <span class="badge" id="bookingsCount">0</span></button>
      </nav>

      <!-- Вкладка: Выбор номера -->
      <div class="tab-content active" id="roomsTab">
        <div class="rooms-grid" id="roomsGrid">
          <!-- Номера будут добавлены через JavaScript -->
        </div>
      </div>

      <!-- Вкладка: Бронирования -->
      <div class="tab-content" id="bookingsTab">
        <!-- Фильтры -->
        <div class="bookings-filters">
          <select id="statusFilter" class="filter-select">
            <option value="all">Все бронирования</option>
            <option value="pending">Ожидают подтверждения</option>
            <option value="confirmed">Подтверждённые</option>
            <option value="cancelled">Отменённые</option>
          </select>

          <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск по имени клиента..." />
        </div>

        <!-- Список бронирований -->
        <div id="bookingsList" class="bookings-list">
          <!-- Бронирования будут добавлены через JavaScript -->
        </div>

        <div id="emptyBookings" class="empty-state">
          <p>📋 У вас пока нет бронирований</p>
        </div>
      </div>
    </div>

    <!-- Модальное окно бронирования -->
    <div id="bookingModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Забронировать номер</h2>
          <button class="modal-close" id="closeModal">×</button>
        </div>

        <div class="modal-body">
          <div class="room-preview" id="roomPreview">
            <!-- Информация о номере -->
          </div>

          <form id="bookingForm" class="booking-form">
            <!-- Даты -->
            <div class="form-section">
              <h3>Даты проживания</h3>
              <div class="form-row">
                <div class="form-group">
                  <label>Заезд:</label>
                  <input type="date" id="checkInDate" required />
                </div>
                <div class="form-group">
                  <label>Выезд:</label>
                  <input type="date" id="checkOutDate" required />
                </div>
              </div>

              <div class="booking-summary" id="bookingSummary">
                <!-- Расчёт будет здесь -->
              </div>
            </div>

            <!-- Данные клиента -->
            <div class="form-section">
              <h3>Ваши данные</h3>
              <div class="form-group">
                <label>Имя и фамилия:</label>
                <input type="text" id="customerName" placeholder="Иван Иванов" required />
              </div>
              <div class="form-group">
                <label>Email:</label>
                <input type="email" id="customerEmail" placeholder="ivan@example.com" required />
              </div>
              <div class="form-group">
                <label>Телефон:</label>
                <input type="tel" id="customerPhone" placeholder="+7 999 123-45-67" required />
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-submit">Забронировать</button>
              <button type="button" class="btn-cancel" id="cancelBooking">Отмена</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script type="module" src="rooms.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
